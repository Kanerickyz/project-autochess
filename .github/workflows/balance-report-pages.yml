# balance-eval / 手动：跑局 → 归档到 docs/balancereport/runs/ → 提交 main → Deploy Web 发布 Pages。
name: Balance Report Pages

on:
  push:
    branches: [balance-eval]
  workflow_dispatch:
    inputs:
      runs:
        description: Number of simulated runs
        required: false
        default: "100"
      seed_start:
        description: First RNG seed
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: balance-report-build
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.6.3"
  BALANCE_RUNS: ${{ github.event.inputs.runs || '100' }}
  BALANCE_SEED_START: ${{ github.event.inputs.seed_start || '1' }}

jobs:
  archive-to-main:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot editor + export templates
        uses: actions/cache@v4
        with:
          path: |
            .github/.godot-cache
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux-templates-v1

      - name: Install Godot ${{ env.GODOT_VERSION }}
        run: |
          set -euo pipefail
          mkdir -p .github/.godot-cache
          base="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          editor_zip=".github/.godot-cache/${base}.zip"
          release="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          if [ ! -f "$editor_zip" ]; then
            curl -fsSL "${release}/${base}.zip" -o "$editor_zip"
          fi
          unzip -qo "$editor_zip" -d /tmp/godot-editor
          sudo install -m 755 "/tmp/godot-editor/${base}" /usr/local/bin/godot
          godot --headless --version

      - name: Import project
        run: godot --headless --path . --import || true

      - name: Run balance batch (headless)
        run: |
          set -euo pipefail
          BATCH_OUT="$RUNNER_TEMP/sim_balance_batch"
          mkdir -p "$BATCH_OUT"
          bash tools/sim_balance/run_batch.sh "$BALANCE_RUNS" "$BALANCE_SEED_START" "$BATCH_OUT"
          test -f "$BATCH_OUT/summary.json"
          echo "BATCH_OUT=$BATCH_OUT" >> "$GITHUB_ENV"

      - name: Archive report (runs/ + manifest + latest summary.json)
        id: archive
        run: |
          set -euo pipefail
          RUN_ID="$(python3 tools/sim_balance/archive_batch_report.py "$BATCH_OUT" "$GITHUB_WORKSPACE")"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          test -f "docs/balancereport/runs/${RUN_ID}/summary.json"
          test -f docs/balancereport/manifest.json

      - name: Upload balance-summary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: balance-summary-${{ steps.archive.outputs.run_id }}
          path: docs/balancereport/runs/${{ steps.archive.outputs.run_id }}/summary.json
          retention-days: 90

      - name: Commit and push archive to main
        env:
          RUN_ID: ${{ steps.archive.outputs.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          STAGING="$RUNNER_TEMP/balancereport-staging"
          mkdir -p "$STAGING/runs/${RUN_ID}"
          cp docs/balancereport/manifest.json "$STAGING/"
          cp docs/balancereport/summary.json "$STAGING/"
          cp "docs/balancereport/runs/${RUN_ID}/summary.json" "$STAGING/runs/${RUN_ID}/"

          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          mkdir -p "docs/balancereport/runs/${RUN_ID}"
          cp "$STAGING/manifest.json" docs/balancereport/
          cp "$STAGING/summary.json" docs/balancereport/
          cp "$STAGING/runs/${RUN_ID}/summary.json" "docs/balancereport/runs/${RUN_ID}/"

          git add docs/balancereport/manifest.json docs/balancereport/summary.json docs/balancereport/runs/
          git diff --staged --quiet && echo "Nothing new to commit" && exit 0
          git commit -m "chore(balancereport): archive sim batch ${RUN_ID}"
          git push origin main
