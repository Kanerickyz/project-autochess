# Export a single-threaded Godot Web build and deploy to GitHub Pages.
# thread_support=false → no SharedArrayBuffer / COOP-COEP headers needed.
#
# Private repos: GitHub Pages requires Pro/Team/Enterprise (or make the repo public).
# Even without Pages, this workflow uploads a downloadable web-build Artifact.

name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.6.3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot editor + export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            .github/.godot-cache
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-linux-templates-v1

      - name: Install Godot ${{ env.GODOT_VERSION }} + Web templates
        run: |
          set -euo pipefail
          mkdir -p .github/.godot-cache
          base="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          editor_zip=".github/.godot-cache/${base}.zip"
          templates_tpz=".github/.godot-cache/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          release="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"

          if [ ! -f "$editor_zip" ]; then
            curl -fsSL "${release}/${base}.zip" -o "$editor_zip"
          fi
          if [ ! -f "$templates_tpz" ]; then
            curl -fsSL "${release}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o "$templates_tpz"
          fi

          unzip -qo "$editor_zip" -d /tmp/godot-editor
          sudo install -m 755 "/tmp/godot-editor/${base}" /usr/local/bin/godot

          tdir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          if [ ! -f "$tdir/web_nothreads_release.zip" ] && [ ! -f "$tdir/web_release.zip" ]; then
            mkdir -p "$tdir"
            unzip -qo "$templates_tpz" -d /tmp/godot-templates
            mv /tmp/godot-templates/templates/* "$tdir/"
          fi

          godot --headless --version

      - name: Import project + export Web
        run: |
          set -euo pipefail
          # First pass builds .godot/ import + class cache.
          godot --headless --path . --import || true
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.html
          test -f build/web/index.pck || test -f build/web/*.pck
          touch build/web/.nojekyll
          ls -lah build/web

      - name: Upload web-build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          if-no-files-found: error
          retention-days: 14

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
