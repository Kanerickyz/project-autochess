# balance-eval 构建完成后，在 main 上下文部署 Pages（github-pages 环境仅允许 main 分支部署策略）。
name: Balance Report Deploy

on:
  workflow_run:
    workflows: ["Balance Report Pages"]
    types: [completed]
    branches: [balance-eval]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.head_branch == 'balance-eval' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download pages-site from Balance Report Pages
        uses: actions/download-artifact@v4
        with:
          name: pages-site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
