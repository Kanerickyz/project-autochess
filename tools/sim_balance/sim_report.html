<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sim Balance 报告</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0f1115; color: #e8eaed; }
    body { margin: 0 auto; max-width: 980px; padding: 1.5rem; }
    header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.75rem; margin-bottom: 0.5rem; }
    h1 { font-size: 1.35rem; font-weight: 600; margin: 0; }
    .badge { font-size: 0.8rem; padding: 0.2rem 0.55rem; border-radius: 6px; background: #2a3142; color: #b8c5e0; }
    .badge strong { color: #fff; }
    .meta { opacity: 0.85; font-size: 0.88rem; margin-bottom: 1rem; line-height: 1.5; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.65rem; margin: 1rem 0; }
    .card { background: #1a1d24; border-radius: 8px; padding: 0.65rem 0.85rem; }
    .card .label { font-size: 0.72rem; opacity: 0.7; }
    .card .value { font-size: 1.25rem; font-weight: 600; }
    .chart-block { margin: 1.5rem 0; }
    .chart-block h2 { font-size: 1.05rem; margin: 0 0 0.25rem; }
    .chart-desc { font-size: 0.82rem; opacity: 0.72; margin: 0 0 0.5rem; }
    .axis-hint { font-size: 0.75rem; opacity: 0.55; margin-bottom: 0.35rem; }
    canvas { background: #1a1d24; border-radius: 8px; padding: 0.5rem; max-height: 300px; width: 100%; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 1rem; }
    th, td { border-bottom: 1px solid #2a2f3a; padding: 0.4rem 0.5rem; text-align: left; }
    input[type=file] { margin: 0.5rem 0 1rem; }
    .run-picker { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin: 0.5rem 0 1rem; font-size: 0.88rem; }
    .run-picker select { flex: 1; min-width: 12rem; max-width: 100%; padding: 0.35rem 0.5rem; background: #1a1d24; color: inherit; border: 1px solid #2a2f3a; border-radius: 6px; }
    .hint, .warn { font-size: 0.8rem; opacity: 0.65; }
    .warn { color: #f0ad4e; }
    #chartMount { display: flex; flex-direction: column; gap: 0.5rem; }
  </style>
</head>
<body>
  <header>
    <h1>自动跑局 · 平衡报告</h1>
    <span class="badge" id="gameVersionBadge">游戏版本 <strong>—</strong></span>
    <span class="badge" id="schemaBadge">Schema <strong>—</strong></span>
  </header>
  <p class="hint">本地预览 · 归档后可用 <code>docs/balancereport/index.html</code> 与 manifest</p>
  <p id="loadWarn" class="warn" hidden>未找到报告数据：请归档或手动选择 JSON。</p>
  <div class="run-picker">
    <label id="runSelectLabel" for="runSelect" hidden>历史报告</label>
    <select id="runSelect" hidden aria-label="历史报告"></select>
  </div>
  <input type="file" id="file" accept="application/json,.json" />
  <div id="root" hidden>
    <div class="meta" id="meta"></div>
    <div class="cards" id="kpiCards"></div>
    <div id="chartMount"></div>
    <h2>分层数据表</h2>
    <table><thead><tr><th>层</th><th>尝试</th><th>胜</th><th>胜率</th><th>失败率</th></tr></thead><tbody id="floorTable"></tbody></table>
    <h2>图表规格（机器可读）</h2>
    <table><thead><tr><th>id</th><th>类型</th><th>标题</th><th>说明</th></tr></thead><tbody id="chartSpecTable"></tbody></table>
  </div>
  <script src="report.js"></script>
</body>
</html>
